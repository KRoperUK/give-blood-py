name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@7987652d64b4581673a76e33ad5e98e3dd56832f # v4.1.3
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI trusted publishing — no long-lived API token stored in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.13"
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2

      # Belt and braces before an irreversible publish: PyPI rejects nothing
      # after upload, and a version can never be replaced.
      - name: Validate metadata and lock file
        run: poetry check

      - run: poetry build

      - name: Verify the artifacts render on PyPI
        run: |
          pipx install twine || pip install twine
          twine check dist/*

      # Trusted publishing: the job exchanges its OIDC token for a short-lived
      # PyPI credential, so no long-lived API token is stored in this repo.
      # Pinned to a SHA like every other action here, with Dependabot to bump it,
      # rather than tracking the floating release/v1 branch.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Fail loudly if a version is somehow already on PyPI, rather than
          # silently doing nothing and reporting success.
          skip-existing: false
          verbose: true
