name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# release-please mutates a single long-lived branch and ref per release. Two runs
# overlapping race on it, and one fails with "Error updating ref". Queue rather
# than cancel: cancelling mid-run can leave that branch half-written.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      # PyPI trusted publishing — no long-lived API token stored in the repo.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"
      - uses: snok/install-poetry@a783c322200f0519c7926aa6faa857c4e23e9263 # v1.4.2

      # Belt and braces before an irreversible publish: PyPI rejects nothing
      # after upload, and a version can never be replaced.
      - name: Validate metadata and lock file
        run: poetry check

      - run: poetry build

      - name: Verify the artifacts render on PyPI
        run: |
          pipx install twine || pip install twine
          twine check dist/*

      # Trusted publishing: the job exchanges its OIDC token for a short-lived
      # PyPI credential, so no long-lived API token is stored in this repo.
      # Pinned to a SHA like every other action here, with Dependabot to bump it,
      # rather than tracking the floating release/v1 branch.
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          # Fail loudly if a version is somehow already on PyPI, rather than
          # silently doing nothing and reporting success.
          skip-existing: false
          verbose: true
